name: SIEM validation
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  mariadb-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: integration-only
          MARIADB_DATABASE: malsonsa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r backend/requirements.txt
      - name: Exercise actual central storage and existing APIs
        env:
          SOC_MARIADB_TEST_CONFIG: '{"host":"127.0.0.1","user":"root","password":"integration-only","database":"malsonsa_test"}'
        run: python -m unittest discover -s tests -p test_central.py -v
  installer-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify release archive
        run: |
          python3 scripts/build_release.py
          cd release
          sha256sum -c SHA256SUMS
          tar -xzf malsonsa-v1.0.tar.gz
          cd malsonsa-v1.0
          sha256sum -c SHA256SUMS
          bash -n install.sh
      - name: Fresh install from packaged sources
        run: sudo bash release/malsonsa-v1.0/install.sh --hostname localhost --web-port 18088 --backend-port 18089 --syslog-port 15514
      - name: Test TCP UDP UI and correlation
        run: sudo python3 release/malsonsa-v1.0/scripts/verify_install.py --web-port 18088 --syslog-port 15514 --token-file release/probe.txt
      - name: Upgrade and preserve existing database
        run: |
          sudo bash release/malsonsa-v1.0/install.sh --upgrade --skip-os-packages --hostname localhost --web-port 18088 --backend-port 18089 --syslog-port 15514
          sudo python3 - <<'PY'
          from pathlib import Path
          import subprocess
          subprocess.run(['python3','release/malsonsa-v1.0/scripts/verify_install.py','--web-port','18088','--syslog-port','15514','--expect-token',Path('release/probe.txt').read_text()],check=True)
          PY
          sudo python3 release/malsonsa-v1.0/scripts/verify_install.py --web-port 18088 --syslog-port 15514
          sudo python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('/var/lib/soc-siem/siem.db')
          assert c.execute('SELECT COUNT(*) FROM events').fetchone()[0] >= 4
          c.close()
          PY
      - name: Verify ingestion after log rotation
        run: |
          sudo logrotate -f /etc/logrotate.d/malsonsa
          sleep 2
          sudo python3 release/malsonsa-v1.0/scripts/verify_install.py --web-port 18088 --syslog-port 15514
      - name: Service diagnostics
        if: failure()
        run: |
          sudo systemctl status soc-siem soc-event-enricher rsyslog nginx --no-pager || true
          sudo journalctl -u soc-siem -u soc-event-enricher -u rsyslog -n 100 --no-pager
      - uses: actions/upload-artifact@v4
        with:
          name: malsonsa-v1.0-package
          path: |
            release/malsonsa-v1.0.tar.gz
            release/SHA256SUMS
  merge-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source of main pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          if os.environ['EVENT_NAME'] == 'pull_request' and os.environ['BASE_BRANCH'] == 'main':
              assert os.environ['HEAD_BRANCH'] == 'develop', 'Only develop may be merged into main'
              assert os.environ['HEAD_REPO'] == os.environ['CURRENT_REPO'], 'Use this repository develop branch'
          if os.environ['EVENT_NAME'] == 'pull_request' and os.environ['BASE_BRANCH'] == 'develop':
              assert os.environ['HEAD_BRANCH'].startswith('feature/'), 'Use a feature branch for develop pull requests'
          PY
  siem-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q backend dashboard/backend/app
      - run: python -m unittest discover -s tests -v
  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node ../../tests/test_event_time.cjs
      - run: node ../../tests/test_risk_details.cjs
      - run: node ../../tests/test_event_render.cjs
      - run: node ../../tests/test_log_views.cjs
