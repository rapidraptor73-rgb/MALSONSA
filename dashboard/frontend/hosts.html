<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSC SOC - Host Registry</title>
<link rel="stylesheet" href="/theme.css?v=20261010-white">
<script src="/site-config.js?v=1.0"></script>
</head>
<body>
<header><div><h1>관제 호스트 관리</h1><p>로그를 전송하는 호스트와 수집 현황을 관리합니다.</p></div><nav><a href="/">메인</a><a href="/rsyslog.html">Rsyslog Correlation</a></nav></header>
<main>
<section class="panel"><div class="title">신규 관제 대상 등록</div>
<div class="form">
<input id="name" placeholder="호스트명 예: MGT01">
<input id="ip" placeholder="호스트 IP 예: 203.230.44.163">
<select id="os_type"><option value="">OS 선택</option><option>Rocky Linux</option><option>Ubuntu</option><option>Windows</option><option>Network Device</option><option>Other</option></select>
<input id="role" placeholder="역할 예: DB / WAS / DNS">
<input id="note" placeholder="비고">
<button class="primary" onclick="addHost()">등록</button>
</div>
<div class="help">등록 IP = rsyslog를 <span id="collectorAddress">이 서버</span>로 보내는 실제 관제 대상 호스트 IP. 공격자 IP(src_ip)와 별도입니다.</div>
</section>
<section class="panel"><div class="title">등록 호스트</div><div style="overflow:auto">
<table><thead><tr><th>상태</th><th>HOST</th><th>IP</th><th>OS</th><th>ROLE</th><th>EVENTS</th><th>LAST SEEN</th><th>비고</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table>
</div></section>
</main>
<script>
document.getElementById('collectorAddress').textContent=window.SOC_CONFIG?.host_ip||location.hostname;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){
 const j=await (await fetch('/api/hosts')).json();
 rows.innerHTML=(j.hosts||[]).map(h=>`<tr>
 <td class="${h.enabled?'on':'off'}">${h.enabled?'ENABLED':'DISABLED'}</td><td><b>${esc(h.name)}</b></td><td>${esc(h.ip)}</td>
 <td>${esc(h.os_type)}</td><td>${esc(h.role)}</td><td>${h.event_count}</td><td>${esc(h.last_seen||'-')}</td><td>${esc(h.note)}</td>
 <td><button onclick="toggleHost(${h.id},${h.enabled?'false':'true'})">${h.enabled?'중지':'활성'}</button>
 <button class="danger" onclick="removeHost(${h.id})">삭제</button></td></tr>`).join('');
}
async function addHost(){
 const p={name:name.value.trim(),ip:ip.value.trim(),os_type:os_type.value,role:role.value.trim(),note:note.value.trim()};
 const r=await fetch('/api/hosts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
 const j=await r.json(); if(!r.ok){alert(j.error||'등록 실패');return;} location.reload();
}
async function toggleHost(id,enabled){await fetch('/api/hosts/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled})});load();}
async function removeHost(id){if(!confirm('삭제할까요?'))return;await fetch('/api/hosts/'+id,{method:'DELETE'});load();}
load();setInterval(load,10000);
</script></body></html>
