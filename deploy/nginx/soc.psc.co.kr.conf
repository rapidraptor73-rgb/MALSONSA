# ============================================================
# HTTP -> HTTPS
# ============================================================

server {

    listen 80;
    listen [::]:80;

    server_name soc.psc.co.kr;

    return 301 https://soc.psc.co.kr$request_uri;
}


# ============================================================
# PSC SOC HTTPS
# ============================================================

server {

    listen 443 ssl;
    listen [::]:443 ssl;

    server_name soc.psc.co.kr;


    # --------------------------------------------------------
    # TLS Certificate
    # --------------------------------------------------------

    ssl_certificate
        /etc/nginx/ssl/soc.psc.co.kr.crt;

    ssl_certificate_key
        /etc/nginx/ssl/soc.psc.co.kr.key;


    ssl_protocols
        TLSv1.2 TLSv1.3;


    # --------------------------------------------------------
    # Frontend
    # --------------------------------------------------------

    root
        /usr/share/nginx/html/soc/frontend;

    index
        index.html;


    location / {

        try_files
            $uri
            $uri/
            /index.html;

    }


    # --------------------------------------------------------
    # ÀÚÃ¼ SIEM Backend API
    # --------------------------------------------------------

    location /api/ {

        proxy_pass
            http://127.0.0.1:8000;

        proxy_http_version
            1.1;

        proxy_set_header
            Host $host;

        proxy_set_header
            X-Real-IP $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto https;

    }


    # --------------------------------------------------------
    # Logs
    # --------------------------------------------------------

    access_log
        /var/log/nginx/soc_access.log;

    error_log
        /var/log/nginx/soc_error.log;

}