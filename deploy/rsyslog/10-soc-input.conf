# PSC SOC rsyslog receiver
# IMPORTANT: 다른 rsyslog 설정 파일에 imtcp/imudp 514 input이 이미 있으면 중복 설정을 제거하세요.

module(load="imtcp")
module(load="imudp")

input(type="imtcp" port="514")
input(type="imudp" port="514")

template(
  name="SocNetworkFormat"
  type="string"
  string="%timereported:::date-rfc3339%|%hostname%|%fromhost-ip%|%syslogfacility-text%|%syslogseverity-text%|%programname%|%msg%\n"
)

if ($inputname == "imtcp" or $inputname == "imudp") then {
  action(
    type="omfile"
    file="/var/log/soc/all-rsyslog.log"
    template="SocNetworkFormat"
    createDirs="on"
  )
  stop
}
