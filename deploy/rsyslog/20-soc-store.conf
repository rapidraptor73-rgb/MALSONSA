template(
    name="SocRawFormat"
    type="string"
    string="%timereported%|%hostname%|%fromhost-ip%|%syslogfacility-text%|%syslogseverity-text%|%programname%|%msg%\n"
)

if ($inputname == "imtcp" or $inputname == "imudp") then {
    action(
        type="omfile"
        file="/var/log/soc/all-rsyslog.log"
        template="SocRawFormat"
    )
}
